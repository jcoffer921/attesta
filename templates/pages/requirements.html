{% extends "app_base.html" %}{% block app_content %}
<div class="page-header"><div><p class="eyebrow">Compliance management</p><h1>Requirements</h1><p>Manage, track, and fulfill compliance requirements across all frameworks.</p></div><button class="button button-primary" data-toast="New requirement workflow opened">+ Add Requirement</button></div>
<section class="card table-card">
<div class="filterbar"><label class="search-box"><svg><use href="#i-search"/></svg><input data-table-search placeholder="Search requirements"></label><select data-filter="framework"><option value="">All Frameworks</option></select><select data-filter="status"><option value="">All Statuses</option><option>Complete</option><option>In Review</option><option>At Risk</option><option>Missing</option></select><select><option>All Priorities</option><option>High</option><option>Medium</option><option>Low</option></select><button class="button button-secondary">☷ Filters</button></div>
<div class="table-scroll"><table data-table><thead><tr><th><input type="checkbox" aria-label="Select all"></th><th>Requirement</th><th>Framework</th><th>Owner</th><th>Status</th><th>Evidence</th><th>Due Date</th><th>Priority</th></tr></thead><tbody>
</tbody></table><p class="muted table-empty">No requirements have been added yet.</p></div></section>
{% endblock %}
