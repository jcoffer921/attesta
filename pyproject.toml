[project]
name = "attesta"
version = "0.1.0"
description = "Compliance you can prove. NPDES/DMR compliance reporting platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0,<6.1",
    "django-environ>=0.14.0",
    "google-generativeai>=0.8.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
